
name: Auto PR 

on:
  push:
    branches:
      - clear-project

permissions:
  pull-requests: write
  contents: write
  
jobs:
  create-pr:
    if: "!contains(github.event.head_commit.message, 'Merge')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            head: 'clear-project'    
            base: 'clear-project2' 
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Auto PR: Branch hh → ${base}`,
              body: 'Automatically created PR from branch hh to ${base}'
            })
